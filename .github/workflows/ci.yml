name: Canon workspace

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            packages/fastapi-streams/package-lock.json
            packages/fastapi-webrtc/package-lock.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.2'
          enable-cache: true
      - run: uv sync --locked --all-packages --all-groups --python ${{ matrix.python }}
      - run: npm ci --ignore-scripts --prefix packages/fastapi-streams
      - run: npm ci --ignore-scripts --prefix packages/fastapi-webrtc
      - run: uv run --locked python scripts/check.py all
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        name: WebRTC sessions in Chromium
        run: |
          (cd packages/fastapi-webrtc && npx playwright install --with-deps chromium)
          uv run --locked python scripts/check.py browser
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: uv run --locked python scripts/check_distributions.py
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: uv run --locked python scripts/check_streams_artifacts.py
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: uv run --locked python scripts/check_webrtc_artifacts.py
