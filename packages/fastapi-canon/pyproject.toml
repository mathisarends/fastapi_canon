[project]
name = "fastapi-canon"
version = "0.10.0"
description = "Typed FastAPI applications with Dishka, HTTP contracts, SSE, WebSockets, WebRTC and client generation"
readme = "README.md"
authors = [{ name = "mathisarends" }]
license = "MIT"
requires-python = ">=3.12,<3.15"
classifiers = [
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "dishka>=1.10,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
otel = ["fastapi>=0.143,<1", "opentelemetry-api>=1.40,<2"]
sse = ["fastapi>=0.143.3,<1", "pydantic>=2.11.2,<3"]
websockets = [
    "pydantic>=2.11,<3",
    "pydantic-core>=2.33",
    "typing-extensions>=4.12.2",
]
webrtc = ["anyio>=4", "starlette>=0.41", "typing-extensions>=4.12"]
aiortc = ["aiortc>=1.14,<2"]
codegen = [
    "jsonschema>=4.23,<5", "jinja2>=3.1,<4",
    "pydantic>=2.11.2,<3", "typing-extensions>=4.12.2",
]

[project.scripts]
canon = "fastapi_canon.cli:main"

[project.urls]
Homepage = "https://github.com/mathisarends/fastapi_canon"
Repository = "https://github.com/mathisarends/fastapi_canon"
Documentation = "https://github.com/mathisarends/fastapi_canon/tree/main/packages/fastapi-canon/docs"
Issues = "https://github.com/mathisarends/fastapi_canon/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fastapi_canon"]

[dependency-groups]
dev = [
    "opentelemetry-sdk>=1.40,<2",
    "httpx>=0.27",
    "httpx2>=2.12.0",
    "jsonschema>=4.23",
    "mypy>=1.15",
    "openapi-spec-validator>=0.7.1",
    "pre-commit>=4.3",
    "pytest>=8.3",
    "ruff>=0.11",
    "types-jsonschema>=4.26",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "fastapi_canon/integrations/sse",
    "fastapi_canon/integrations/websockets",
    "fastapi_canon/integrations/webrtc",
]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["fastapi_canon", "tests"]
exclude = ["fastapi_canon/integrations/(sse|websockets|webrtc)/"]
pretty = true
show_error_codes = true
warn_unreachable = true

[[tool.mypy.overrides]]
# These modules retain their own strict feature checks in scripts/check.py.
module = [
    "fastapi_canon.integrations.sse.*",
    "fastapi_canon.integrations.websockets.*",
    "fastapi_canon.integrations.webrtc.*",
]
follow_imports = "silent"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
