[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.canon-websockets.typecheck]
min_completeness = 0.92

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-p", "no:asyncio", "-p", "pytest_asyncio.plugin"]

[tool.coverage.run]
source = ["fastapi_canon.integrations.websockets"]
branch = true

[tool.coverage.report]
show_missing = true
