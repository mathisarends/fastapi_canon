[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["examples/agent_runs/generated_python", "tests/fixtures/generated_python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = [
  "../fastapi-canon/fastapi_canon/integrations/sse",
  "examples",
  "tests/fixtures/generated_python",
]
venvPath = "../.."
venv = ".venv"
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pylint.main]
py-version = "3.12"
ignore-paths = [".*/sse/codegen/templates/.*"]

[tool.pylint.messages_control]
# Ruff owns formatting and style; Pylint checks errors and warnings.
disable = ["C", "R"]

[tool.pylint.reports]
score = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["snapshot: golden schemas and clients tied to the locked dependencies"]

[tool.coverage.run]
branch = true
source = [
  "fastapi_canon.integrations.sse",
  "examples.agent_runs.generated_python.runtime",
]
omit = ["*/codegen/templates/*"]

[tool.coverage.report]
show_missing = true
fail_under = 85

