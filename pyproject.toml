[project]
name = "canon-workspace"
version = "0.0.0"
description = "Development workspace for the Canon FastAPI stack (not published)"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi-canon[aiortc,codegen,otel,sse,websockets,webrtc]==0.9.0",
    "fastapi-canon-reference",
]

[dependency-groups]
dev = [
    "packaging>=25", "pytest>=8.4.2", "pytest-asyncio>=1", "ruff>=0.12",
    "pytest-cov>=6", "uvicorn>=0.38", "websockets>=15", "httpx>=0.28",
    "httpx2>=2.13.1,<3", "pyright==1.1.414", "pylint>=4,<5",
    "build>=1.2", "twine>=7,<8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/fastapi-canon", "examples/reference-service"]

[tool.uv.sources]
fastapi-canon = { workspace = true }
fastapi-canon-reference = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests/integration"]
addopts = ["--strict-config", "--strict-markers"]
