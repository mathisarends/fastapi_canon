[project]
name = "fastapi-canon"
version = "0.4.0"
description = "Opinionated FastAPI feature composition with Dishka and Problem Details"
readme = "README.md"
authors = [{ name = "mathisarends" }]
license = "MIT"
requires-python = ">=3.12,<3.15"
classifiers = [
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "dishka>=1.10,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
]

[project.urls]
Homepage = "https://github.com/mathisarends/fastapi_canon"
Repository = "https://github.com/mathisarends/fastapi_canon"
Issues = "https://github.com/mathisarends/fastapi_canon/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fastapi_canon"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "httpx2>=2.12.0",
    "jsonschema>=4.23",
    "mypy>=1.15",
    "openapi-spec-validator>=0.7.1",
    "pre-commit>=4.3",
    "pytest>=8.3",
    "ruff>=0.11",
    "types-jsonschema>=4.26",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["fastapi_canon", "tests"]
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
