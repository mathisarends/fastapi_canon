[project]
name = "fastapi-canon"
version = "0.1.0"
description = "Feature-oriented composition for FastAPI applications"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "dishka>=1.10,<2",
    "fastapi>=0.115,<1",
    "fastapi-faults>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fastapi_canon"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["fastapi_canon", "tests"]
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
